<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simon app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon App</h1>
    <h3>Please start the game by pressing any key on the keyword</h3>
    <div class="box1">
        <button class="pink btn" id="pink">1</button>
        <button class="blue btn" id="blue">2</button>
    </div>
    <div class="box2">
        <button class="yellow btn" id="yellow">3</button>
        <button class="green btn" id="green">4</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
